name: Hiring Intelligence tests

on:
  push:
    paths:
      - 'japp_hiring_intelligence.py'
      - 'hiring_intelligence_config.json'
      - 'tests/test_hiring_intelligence.py'
      - '.github/workflows/hiring_intelligence_tests.yml'
  pull_request:
    paths:
      - 'japp_hiring_intelligence.py'
      - 'hiring_intelligence_config.json'
      - 'tests/test_hiring_intelligence.py'
      - '.github/workflows/hiring_intelligence_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openpyxl>=3.1'
      - run: python -m unittest discover -s tests -p 'test_hiring_intelligence.py' -v
