name: JAPP tests

on:
  push:
    paths:
      - 'japp_hiring_intelligence.py'
      - 'hiring_intelligence_config.json'
      - 'automation/**/*.py'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'tests/**'
      - 'docs/commands/automation.md'
      - '.github/workflows/hiring_intelligence_tests.yml'
  pull_request:
    paths:
      - 'japp_hiring_intelligence.py'
      - 'hiring_intelligence_config.json'
      - 'automation/**/*.py'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'tests/**'
      - 'docs/commands/automation.md'
      - '.github/workflows/hiring_intelligence_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
